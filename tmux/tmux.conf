# ── Status line ───────────────────────────────────────────────────────

set -g @c-base default
set -g @c-base-content "#28ebff"
set -g @c-primary "#28ebff"
set -g @c-primary-content "#011316"
set -g @c-secondary "#ff7d5d"
set -g @c-secondary-content "#011316"
set -g @c-accent default
set -g @c-accent-content "#c7d2df"
set -g @c-neutral default
set -g @c-neutral-content "#61738d"

set -g @c-mode "#{?client_prefix,#{@c-secondary},#{@c-primary}}"
set -g @c-mode-content "#{?client_prefix,#{@c-secondary-content},#{@c-primary-content}}"

# border - neutral color
set -g status 2
set -g status-format[1] "#[fg=#{@c-neutral-content},bg=#{@c-neutral}]#{R:─,#{client_width}}"

# Basic status bar setup
set -g status-position top
set -g status-interval 3
set -g status-justify left
set -g status-style bg=default

# Status left - mode color
set -g status-left-length 30
set -g status-left "\
#[bg=default,fg=#{E:@c-mode}]\
#[bg=#{E:@c-mode},fg=#{E:@c-mode-content}]  \
#[fg=#{E:@c-mode-content}]#S \
#[bg=default,fg=#{E:@c-mode}] "

# Status right - mode color
set -g status-right-length 100
set -g status-right "\
#[bg=default,fg=#{E:@c-mode}]\
#[bg=#{E:@c-mode},fg=#{E:@c-mode-content}] \
#[fg=#{E:@c-mode-content}]#([ #{pane_current_path} = $HOME ] && echo '~' || basename #{pane_current_path}) \
#[fg=#{E:@c-mode-content}]│ \
#[fg=#{E:@c-mode-content}] \
#[fg=#{E:@c-mode-content}]#(date +%H:%M)\
#[bg=default,fg=#{E:@c-mode}]"

# Window status format - accent / neutral color
set -g window-status-separator ""
set -g window-status-format "#[fg=#{@c-neutral-content},bg=#{@c-neutral}] #I:#W#{?window_zoomed_flag, \uF002,} "
set -g window-status-current-format "#[fg=#{@c-accent-content},bg=#{@c-accent},bold] #I:#W#{?window_zoomed_flag, \uF002,} "

# Pane borders - accent / neutral color
set -g pane-border-style "fg=#{@c-neutral-content}"
set -g pane-active-border-style "fg=#{@c-primary}"

# Message style - base color
set -g message-style "bg=#{@c-base},fg=#{@c-base-content},bold"
set -g message-command-style "bg=#{@c-base},fg=#{@c-base-content},bold"

# Copy mode styling - primary color
set -g mode-style "bg=#{@c-primary},fg=#{@c-primary-content},bold"
