# ── General ───────────────────────────────────────────────────────────

# Number windows and panes from 1, so the first window is Prefix + 1
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed (no gaps such as 1 2 4)
set -g renumber-windows on

# Lines of scrollback kept per pane (applies to panes created after this is set)
set -g history-limit 50000

# Show messages for 2 seconds instead of 0.75
set -g display-time 2000

# Pass focus events to programs (Vim autoread, editors that save on blur)
set -s focus-events on

# Prefix + r reloads this file
bind r source-file ~/.config/tmux/tmux.conf \; display-message "~/.config/tmux/tmux.conf reloaded"

# 24-bit true color when the outer terminal's TERM is xterm-256color (3.6+ also detects COLORTERM=truecolor)
set -as terminal-features ",xterm-256color:RGB"

# Extended keys, so programs can tell Ctrl+Shift and Ctrl+Enter apart
set -s extended-keys on
set -as terminal-features ",xterm*:extkeys"

# ── Copy mode and clipboard ───────────────────────────────────────────

# vi keys in copy mode (h/j/k/l, /, ?, w, b ...)
setw -g mode-keys vi

# Vim-like selection: v starts, Ctrl+v toggles block mode, y copies and exits
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel

# Line numbers in copy mode (new in tmux 3.7)
setw -g copy-mode-line-numbers absolute

# ── Panes and windows ─────────────────────────────────────────────────

# prefix + vim のキーバインドでペインを分割する
bind v split-window -h
bind s split-window -v

# Prefix + h/j/k/l moves between panes like Vim
# (l replaces last-window; Prefix + ; still goes to the last pane)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Prefix + H/J/K/L resizes the pane by 5 cells; hold the letter to repeat
# (L replaces switch-client -l)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Status line ───────────────────────────────────────────────────────

BG_COLOR="#1e1e1e"
ACTIVE_COLOR="#b4befe"
INACTIVE_COLOR="#6c7086"
TEXT_COLOR="#cdd6f4"
ACCENT_COLOR="#b4befe"

# Basic status bar setup
set -g status on
set -g status-position top
set -g status-interval 3
set -g status-justify left

# Pane borders
set -g pane-border-style "fg=#44475a"
set -g pane-active-border-style "fg=$ACTIVE_COLOR"

# Status bar colors and style
set -g status-style "bg=$BG_COLOR,fg=$TEXT_COLOR"
set -g status-left-length 100
set -g status-right-length 100

# Message style
set -g message-style "bg=$BG_COLOR,fg=$TEXT_COLOR,bold"
set -g message-command-style "bg=$BG_COLOR,fg=$TEXT_COLOR,bold"

# Window status format - using dots instead of asterisks
set -g window-status-format "#[fg=$INACTIVE_COLOR,bg=$BG_COLOR] #I:#W "
set -g window-status-current-format "#[fg=$ACTIVE_COLOR,bg=$BG_COLOR,bold] #I:#W "

# Window status separator
set -g window-status-separator ""

# Status left (session name with minimal styling)
set -g status-left "#[fg=$ACCENT_COLOR,bold]  #S #[fg=$INACTIVE_COLOR]│ "

# Status right
set -g status-right "\
#[fg=$ACCENT_COLOR] #[fg=$TEXT_COLOR]#([ #{pane_current_path} = $HOME ] && echo '~' || basename #{pane_current_path}) \
#[fg=$INACTIVE_COLOR]│ \
#[fg=$ACCENT_COLOR] #[fg=$TEXT_COLOR]#(date +%H:%M) "

# Copy mode styling
set -g mode-style "bg=$ACTIVE_COLOR,fg=$BG_COLOR"

# Clock mode
set -g clock-mode-colour "$ACTIVE_COLOR"
set -g clock-mode-style 24
