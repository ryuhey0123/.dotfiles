# ── General ───────────────────────────────────────────────────────────

# Number windows and panes from 1, so the first window is Prefix + 1
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed (no gaps such as 1 2 4)
set -g renumber-windows on

# Lines of scrollback kept per pane (applies to panes created after this is set)
set -g history-limit 50000

# Show messages for 2 seconds instead of 0.75
set -g display-time 2000

# Pass focus events to programs (Vim autoread, editors that save on blur)
set -s focus-events on

# Prefix + r reloads this file
bind r source-file ~/.config/tmux/tmux.conf \; display-message "~/.config/tmux/tmux.conf reloaded"

# 24-bit true color when the outer terminal's TERM is xterm-256color (3.6+ also detects COLORTERM=truecolor)
set -as terminal-features ",xterm-256color:RGB"

# Extended keys, so programs can tell Ctrl+Shift and Ctrl+Enter apart
set -s extended-keys on
set -as terminal-features ",xterm*:extkeys"

# ── Copy mode and clipboard ───────────────────────────────────────────

# vi keys in copy mode (h/j/k/l, /, ?, w, b ...)
setw -g mode-keys vi

# Vim-like selection: v starts, Ctrl+v toggles block mode, y copies and exits
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel

# Line numbers in copy mode (new in tmux 3.7)
setw -g copy-mode-line-numbers absolute

# ── Panes and windows ─────────────────────────────────────────────────

# 新しいウインドウを現在のパスで作成
bind c new-window -c '#{pane_current_path}'

# prefix + vim のキーバインドでペインを分割する
bind s split-window -c '#{pane_current_path}'
bind v split-window -h -c '#{pane_current_path}'

# Prefix + h/j/k/l moves between panes like Vim
# (l replaces last-window; Prefix + ; still goes to the last pane)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Prefix + H/J/K/L resizes the pane by 5 cells; hold the letter to repeat
# (L replaces switch-client -l)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# if session has > 1 windows in current, kill-pane without confirmation.
# But confirm before killing pane when it is the last  pane in the last window.
bind x if "tmux display -p \"#{session_windows}\" | grep ^1\$ && tmux display -p \"#{window_panes}\" | grep ^1\$" \
    "confirm-before -p \"Kill the only pane in the only window? It will kill this session too. (y/n)\" kill-pane" \
    "kill-pane"

# ── Status line ───────────────────────────────────────────────────────

set -g @c-base "#1a1a1a"
set -g @c-base-content "#b2ccd6"
set -g @c-primary "#1a1a1a"
set -g @c-primary-content "#28ebff"
set -g @c-accent "#28ebff"
set -g @c-accent-content "#0e0813"
set -g @c-neutral "#1a1a1a"
set -g @c-neutral-content "#61738d"
set -g @c-info "#28ebff"
set -g @c-info-content "#011316"

# Basic status bar setup
set -g status on
set -g status-position top
set -g status-interval 3
set -g status-justify left

# Status left - info color
set -g status-left-length 30
set -g status-left "\
#[bg=#{@c-base},fg=#{@c-info}]\
#[bg=#{@c-info},fg=#{@c-base}]  \
#[fg=#{@c-info-content}]#S \
#[bg=#{@c-base},fg=#{@c-info}] "

# Status right - info color
set -g status-right-length 100
set -g status-right "\
#[bg=#{@c-base},fg=#{@c-info}]\
#[bg=#{@c-info},fg=#{@c-base}] \
#[fg=#{@c-info-content}]#([ #{pane_current_path} = $HOME ] && echo '~' || basename #{pane_current_path}) \
#[fg=#{@c-base}]│ \
#[fg=#{@c-base}] \
#[fg=#{@c-info-content}]#(date +%H:%M)\
#[bg=#{@c-base},fg=#{@c-info}]"

# Window status format - primary / neutral color
set -g window-status-separator ""
set -g window-status-format "#[fg=#{@c-neutral-content},bg=#{@c-neutral}] #I:#W "
set -g window-status-current-format "#[fg=#{@c-primary-content},bg=#{@c-primary},bold] #I:#W "

# Pane borders - primary / neutral color
set -g pane-border-style "fg=#{@c-neutral-content}"
set -g pane-active-border-style "fg=#{@c-primary-content}"

# Message style - accent color
set -g message-style "bg=#{@c-accent},fg=#{@c-accent-content},bold"
set -g message-command-style "bg=#{@c-accent},fg=#{@c-accent-content},bold"

# Copy mode styling - accent color
set -g mode-style "bg=#{@c-accent},fg=#{@c-accent-content},bold"
